
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events API | StudentHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f3ef;
            color: #292720;
            padding: 24px;
        }
        main { max-width: 1000px; margin: auto; }
        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }
        input, textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0 14px;
        }
        button {
            padding: 10px 14px;
            margin: 4px;
            cursor: pointer;
        }
        .message { padding: 12px; margin: 12px 0; }
        .event {
            border-top: 1px solid #ddd;
            padding: 14px 0;
        }
        .event button { margin-top: 8px; }
    </style>
</head>
<body>
<main>
    <h1>StudentHub Event Manager</h1>

    <section>
        <h2 id="formTitle">Add Event</h2>
        <form id="eventForm">
            <input type="hidden" id="eventId">

            <label for="title">Event title</label>
            <input id="title" maxlength="150" required>

            <label for="description">Description</label>
            <textarea id="description" required></textarea>

            <label for="eventDate">Date</label>
            <input type="date" id="eventDate" required>

            <label for="eventTime">Time</label>
            <input type="time" id="eventTime" required>

            <label for="venue">Venue</label>
            <input id="venue" maxlength="200" required>

            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" min="1" max="100000" required>

            <button type="submit">Save Event</button>
            <button type="button" id="cancelEdit" hidden>Cancel Edit</button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section>
        <h2>Events List</h2>
        <button type="button" id="refreshEvents">Refresh List</button>
        <div id="eventsList">Loading events...</div>
    </section>
</main>

<script src="js/events-api.js"></script>
</body>
</html>
