<section class="feedback-page">

<div class="container">

<h1>

We Value Your Feedback

</h1>

<p>

Help us improve StudentHub by sharing your suggestions.

</p>



<form>

<input
type="text"
placeholder="Your Name"
required>

<input
type="email"
placeholder="Email"
required>

<select>

<option>Rate StudentHub</option>

<option>Excellent</option>

<option>Very Good</option>

<option>Good</option>

<option>Average</option>

<option>Poor</option>

</select>

<textarea
rows="8"
placeholder="Write your feedback here..."
required>

</textarea>

<button
type="submit">

Submit Feedback

</button>

</form>

</div>
